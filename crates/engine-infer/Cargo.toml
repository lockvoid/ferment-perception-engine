[package]
name = "ferment-engine-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["coreml"]
coreml = ["dep:coreml-native", "dep:futures-channel", "dep:sysinfo", "dep:fs4"]
coreai = ["dep:coreai-native", "dep:futures-channel", "dep:sysinfo", "dep:fs4"]
ort = ["dep:ort", "dep:tracing", "dep:sysinfo", "dep:winml-native"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
ferment-engine-core.workspace = true
half.workspace = true
tracing = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
coreml-native = { workspace = true, optional = true }
futures-channel = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreai-native = { path = "../../vendor/coreai-native", optional = true }
fs4 = { version = "1.1.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winml-native = { path = "../../vendor/winml-native", optional = true }

[dev-dependencies]
approx = "0.5"
ferment-engine-test-fixtures.workspace = true
futures-executor = "0.3"
serde_json.workspace = true

[[example]]
name = "ort_model_probe"
required-features = ["ort"]

[[example]]
name = "ort_corpus_probe"
required-features = ["ort"]
