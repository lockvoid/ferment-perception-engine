[project]
name = "edgetam-export"
version = "0.1.0"
description = "EdgeTAM V1 (facebookresearch/EdgeTAM, Apache-2.0) -> four ONNX graphs + Rust goldens"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "numpy<2",
    "onnx>=1.16,<1.20",
    "onnxruntime>=1.18",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "iopath>=0.1.10",
    "pillow",
    # EdgeTAM's image encoder trunk is a timm RepViT.
    "timm>=1.0,<2",
]
